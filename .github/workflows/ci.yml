name: GLPI_CI

on:
  push:
    branches: [ "main", "CI/CD_DEP" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PHP_VERSION: '8.1'
  MYSQL_VERSION: '8.0'

jobs:
  # Job 1: Tests de syntaxe et validation
  syntax-check:
    name: Syntax & Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
        tools: composer, phpunit, phpstan, php-cs-fixer

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.composer/cache
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-

    - name: Check PHP Syntax
      run: |
        find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -exec php -l {} \;

    - name: Validate composer.json
      run: |
        if [ -f composer.json ]; then
          composer validate --strict --no-check-all
        fi

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --no-dev
        fi

  # Job 2: Analyse de sécurité
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Security audit
      run: |
        if [ -f composer.json ]; then
          composer audit --format=json || true
        fi

  # Job 3: Qualité de code
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
        tools: composer, phpstan, php-cs-fixer, phpmd

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Check coding standards
      run: |
        if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
          ./vendor/bin/phpcs --standard=PSR12 --extensions=php src/ || true
        fi

    - name: Run PHPStan
      run: |
        if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
          ./vendor/bin/phpstan analyse --memory-limit=1G || true
        fi

  # Job 4: Tests avec base de données
  tests:
    name: Tests with Database
    runs-on: ubuntu-latest
    needs: [syntax-check, security-scan]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: glpi_test
          MYSQL_DATABASE: glpi_test
          MYSQL_USER: glpi_user
          MYSQL_PASSWORD: glpi_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
        tools: composer, phpunit
        coverage: xdebug

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -pglpi_test --silent; do
          echo 'Waiting for MySQL...'
          sleep 2
        done

    - name: Setup test database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -pglpi_test -e "CREATE DATABASE IF NOT EXISTS glpi_test;"
        mysql -h 127.0.0.1 -P 3306 -u root -pglpi_test -e "GRANT ALL PRIVILEGES ON glpi_test.* TO 'glpi_user'@'%';"

    - name: Run PHPUnit tests
      run: |
        if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
          if [ -f ./vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit --coverage-clover=coverage.xml
          else
            echo "PHPUnit not found in vendor/bin, using global phpunit"
            phpunit --coverage-clover=coverage.xml
          fi
        else
          echo "No PHPUnit configuration found, skipping tests"
        fi
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_NAME: glpi_test
        DB_USER: glpi_user
        DB_PASS: glpi_pass

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # Job 5: Deploy (seulement si tous les tests passent)
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [tests, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/CI/CD_DEP')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Docker tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=ci-cd-dep-{{sha}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 91.134.181.62
        username: root
        password: '@Ntumba26.'
        port: 22
        script: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="ci-cd-dep-$(echo ${{ github.sha }} | cut -c1-7)"
          CONTAINER_NAME="glpi-app"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${IMAGE}:${TAG}
          docker stop ${CONTAINER_NAME} 2>/dev/null || true
          docker rm ${CONTAINER_NAME} 2>/dev/null || true
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart unless-stopped \
            -p 127.0.0.1:8080:80 \
            -v glpi-data:/var/www/html/files \
            -v glpi-config:/var/www/html/config \
            -e DB_HOST="localhost" \
            -e DB_NAME="glpi" \
            -e DB_USER="glpi" \
            -e DB_PASS="glpi123" \
            ${IMAGE}:${TAG}
          docker image prune -f
          sleep 10
          if ! docker ps | grep -q ${CONTAINER_NAME}; then
            echo "Deployment failed"
            exit 1
          fi
