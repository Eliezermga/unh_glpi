name: GLPI_CI

on:
  push:
    branches: [ "main", "CI/CD_DEP" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PHP_VERSION: '8.1'
  MYSQL_VERSION: '8.0'

jobs:
  # Job 1: Tests de syntaxe et validation
  syntax-check:
    name: Syntax & Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
        tools: composer, phpunit, phpstan, php-cs-fixer

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.composer/cache
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-

    - name: Check PHP Syntax
      run: |
        find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -exec php -l {} \;

    - name: Validate composer.json
      run: |
        if [ -f composer.json ]; then
          composer validate --strict --no-check-all
        fi

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --no-dev
        fi

  # Job 2: Analyse de sécurité
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Security audit
      run: |
        if [ -f composer.json ]; then
          composer audit --format=json || true
        fi

  # Job 3: Qualité de code
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
        tools: composer, phpstan, php-cs-fixer, phpmd

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Check coding standards
      run: |
        if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
          ./vendor/bin/phpcs --standard=PSR12 --extensions=php src/ || true
        fi

    - name: Run PHPStan
      run: |
        if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
          ./vendor/bin/phpstan analyse --memory-limit=1G || true
        fi

  # Job 4: Tests avec base de données
  tests:
    name: Tests with Database
    runs-on: ubuntu-latest
    needs: [syntax-check, security-scan]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: glpi_test
          MYSQL_DATABASE: glpi_test
          MYSQL_USER: glpi_user
          MYSQL_PASSWORD: glpi_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
        tools: composer, phpunit
        coverage: xdebug

    - name: Install dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -pglpi_test --silent; do
          echo 'Waiting for MySQL...'
          sleep 2
        done

    - name: Setup test database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -pglpi_test -e "CREATE DATABASE IF NOT EXISTS glpi_test;"
        mysql -h 127.0.0.1 -P 3306 -u root -pglpi_test -e "GRANT ALL PRIVILEGES ON glpi_test.* TO 'glpi_user'@'%';"

    - name: Run PHPUnit tests
      run: |
        if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
          if [ -f ./vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit --coverage-clover=coverage.xml
          else
            echo "PHPUnit not found in vendor/bin, using global phpunit"
            phpunit --coverage-clover=coverage.xml
          fi
        else
          echo "No PHPUnit configuration found, skipping tests"
        fi
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_NAME: glpi_test
        DB_USER: glpi_user
        DB_PASS: glpi_pass

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # Job 5: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [tests, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/CI/CD_DEP')
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Docker tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}
        tags: |
          type=raw,value=ci-cd-dep-{{sha}}
          type=sha,prefix=ci-cd-dep-,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 6: Tests d'intégration post-build
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/CI/CD_DEP')
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration_test
          MYSQL_DATABASE: glpi_integration
          MYSQL_USER: glpi_user
          MYSQL_PASSWORD: glpi_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Test Docker image
      run: |
        IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        TAG="ci-cd-dep-${SHORT_SHA}"
        
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker pull ${IMAGE}:${TAG}
        
        docker run -d --name glpi-test \
          -p 8080:80 \
          -e DB_HOST="host.docker.internal" \
          -e DB_NAME="glpi_integration" \
          -e DB_USER="glpi_user" \
          -e DB_PASS="glpi_pass" \
          ${IMAGE}:${TAG}
        
        sleep 30
        
        if curl -f http://localhost:8080 > /dev/null 2>&1; then
          echo "Application accessible"
        else
          echo "Application non accessible"
          docker logs glpi-test
          exit 1
        fi
        
        docker stop glpi-test
        docker rm glpi-test

  # Job 7: Deploy Dev (parallèle)
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/CI/CD_DEP'
    environment: development
    
    steps:
    - name: Deploy to dev server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
          TAG="ci-cd-dep-$(echo ${{ github.sha }} | cut -c1-7)"
          CONTAINER_NAME="glpi-dev"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${IMAGE}:${TAG}
          docker stop ${CONTAINER_NAME} 2>/dev/null || true
          docker rm ${CONTAINER_NAME} 2>/dev/null || true
          
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart unless-stopped \
            -p 127.0.0.1:8081:80 \
            -v glpi-dev-data:/var/www/html/files \
            -v glpi-dev-config:/var/www/html/config \
            -e DB_HOST="${{ secrets.DEV_DB_HOST }}" \
            -e DB_NAME="${{ secrets.DEV_DB_NAME }}" \
            -e DB_USER="${{ secrets.DEV_DB_USER }}" \
            -e DB_PASS="${{ secrets.DEV_DB_PASSWORD }}" \
            ${IMAGE}:${TAG}
          
          docker exec ${CONTAINER_NAME} php bin/console dependencies install || true
          
          sleep 10
          if ! docker ps | grep -q ${CONTAINER_NAME}; then
            echo "Dev deployment failed"
            exit 1
          fi
          echo "Dev deployment successful"

  # Job 8: Deploy Staging (parallèle)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
          TAG="ci-cd-dep-$(echo ${{ github.sha }} | cut -c1-7)"
          CONTAINER_NAME="glpi-staging"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${IMAGE}:${TAG}
          docker stop ${CONTAINER_NAME} 2>/dev/null || true
          docker rm ${CONTAINER_NAME} 2>/dev/null || true
          
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart unless-stopped \
            -p 127.0.0.1:8082:80 \
            -v glpi-staging-data:/var/www/html/files \
            -v glpi-staging-config:/var/www/html/config \
            -e DB_HOST="${{ secrets.STAGING_DB_HOST }}" \
            -e DB_NAME="${{ secrets.STAGING_DB_NAME }}" \
            -e DB_USER="${{ secrets.STAGING_DB_USER }}" \
            -e DB_PASS="${{ secrets.STAGING_DB_PASSWORD }}" \
            ${IMAGE}:${TAG}
          
          docker exec ${CONTAINER_NAME} php bin/console dependencies install || true
          
          sleep 10
          if ! docker ps | grep -q ${CONTAINER_NAME}; then
            echo "Staging deployment failed"
            exit 1
          fi
          echo "Staging deployment successful"

  # Job 9: Deploy Production (après validation staging)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          # Installation de docker-compose si nécessaire
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Création du répertoire de travail
          mkdir -p ~/glpi-prod
          cd ~/glpi-prod
          
          # Création du fichier .env
          cat > .env << EOF
          DB_NAME=glpi
          DB_USER=glpi_user
          DB_PASS=${{ secrets.PROD_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          EOF
          
          # Téléchargement des fichiers de configuration
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Arrêt des anciens conteneurs
          docker-compose down 2>/dev/null || true
          
          # Création du docker-compose.yml
          cat > docker-compose.yml << 'EOF'
          version: '3.8'
          
          services:
            glpi:
              image: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:ci-cd-dep-$(echo ${{ github.sha }} | cut -c1-7)
              ports:
                - "127.0.0.1:8080:80"
              environment:
                - DB_HOST=mysql
                - DB_USER=${DB_USER}
                - DB_PASS=${DB_PASS}
                - DB_NAME=${DB_NAME}
              depends_on:
                - mysql
              volumes:
                - glpi_files:/var/www/html/files
                - glpi_config:/var/www/html/config
              restart: unless-stopped
          
            mysql:
              image: mysql:8.0
              environment:
                - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
                - MYSQL_DATABASE=${DB_NAME}
                - MYSQL_USER=${DB_USER}
                - MYSQL_PASSWORD=${DB_PASS}
              volumes:
                - mysql_data:/var/lib/mysql
              command: --default-authentication-plugin=mysql_native_password
              restart: unless-stopped
          
          volumes:
            mysql_data:
            glpi_files:
            glpi_config:
          EOF
          
          # Démarrage des services
          docker-compose up -d
          
          # Attente et vérification
          sleep 30
          if ! docker-compose ps | grep -q "Up"; then
            echo "Production deployment failed"
            docker-compose logs
            exit 1
          fi
          echo "Production deployment successful"
