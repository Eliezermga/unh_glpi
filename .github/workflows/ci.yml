name: GLPI_CI

on:
  push:
    branches: [ "main", "pre-product-new" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PHP_VERSION: '8.1'
  MYSQL_VERSION: '5.7'

jobs:
  # Job 1: Tests de syntaxe et validation
  syntax-check:
    name: Syntax & Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
          tools: composer, phpunit, phpstan, php-cs-fixer

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Check PHP Syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -exec php -l {} \;

      - name: Validate composer.json
        run: |
          if [ -f composer.json ]; then
            composer validate --strict --no-check-all
          fi

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress --no-dev
          fi

  # Job 2: Analyse de sécurité
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          fi

      - name: Security audit
        run: |
          if [ -f composer.json ]; then
            composer audit --format=json || true
          fi

  # Job 3: Qualité de code
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
          tools: composer, phpstan, php-cs-fixer, phpmd

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          fi

      - name: Check coding standards
        run: |
          if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
            ./vendor/bin/phpcs --standard=PSR12 --extensions=php src/ || true
          fi

      - name: Run PHPStan
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            ./vendor/bin/phpstan analyse --memory-limit=1G || true
          fi

  # Job 4: Tests avec base de données
  tests:
    name: Tests with Database
    runs-on: ubuntu-latest
    needs: [syntax-check, security-scan]
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: glpi_password
          MYSQL_DATABASE: glpi
          MYSQL_USER: glpi
          MYSQL_PASSWORD: glpi_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, mysqli
          tools: composer, phpunit
          coverage: xdebug

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          fi

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -pglpi_password --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Setup test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pglpi_password -e "CREATE DATABASE IF NOT EXISTS glpi;"
          mysql -h 127.0.0.1 -P 3306 -u root -pglpi_password -e "GRANT ALL PRIVILEGES ON glpi.* TO 'glpi'@'%';"

      - name: Run PHPUnit tests
        run: |
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            if [ -f ./vendor/bin/phpunit ]; then
              ./vendor/bin/phpunit --coverage-clover=coverage.xml
            else
              echo "PHPUnit not found in vendor/bin, using global phpunit"
              phpunit --coverage-clover=coverage.xml
            fi
          else
            echo "No PHPUnit configuration found, skipping tests"
          fi
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: glpi
          DB_USER: glpi
          DB_PASS: glpi_password

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Job 5: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [tests, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre-product-new')
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}
          tags: |
            type=raw,value=ci-cdmysql-{{sha}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Tests d'intégration post-build
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre-product-new')
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: glpi_password
          MYSQL_DATABASE: glpi
          MYSQL_USER: glpi
          MYSQL_PASSWORD: glpi_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Test Docker image
        run: |
          IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
          TAG="ci-cdmysql-$(echo ${{ github.sha }} | cut -c1-7)"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${IMAGE}:${TAG}
          
          # Créer un réseau Docker pour la communication
          docker network create glpi-test-network || true
          
          # Démarrer MySQL dans le réseau
          docker run -d --name mysql-test \
            --network glpi-test-network \
            -e MYSQL_ROOT_PASSWORD=glpi_password \
            -e MYSQL_DATABASE=glpi \
            -e MYSQL_USER=glpi \
            -e MYSQL_PASSWORD=glpi_password \
            mysql:5.7
          
          # Attendre que MySQL soit complètement prêt
          echo "Attente de MySQL..."
          sleep 60
          
          # Vérifier que MySQL accepte les connexions
          docker exec mysql-test mysqladmin ping -h localhost -u root -pglpi_password --silent
          
          # Démarrer GLPI dans le même réseau
          docker run -d --name glpi-test \
            --network glpi-test-network \
            -p 8080:80 \
            -e DB_HOST="mysql-test" \
            -e DB_NAME="glpi" \
            -e DB_USER="glpi" \
            -e DB_PASSWORD="glpi_password" \
            ${IMAGE}:${TAG}
          
          sleep 120
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
          echo "Code HTTP: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "500" ]; then
            echo "Application accessible - Apache fonctionne"
          else
            echo "Application non accessible (code: $HTTP_CODE)"
            docker logs glpi-test
            docker logs mysql-test
            exit 1
          fi
          
          docker stop glpi-test mysql-test
          docker rm glpi-test mysql-test
          docker network rm glpi-test-network

  # Job 7: Deploy Dev
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre-product-new'
    environment: development
    
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
            TAG="ci-cdmysql-$(echo ${{ github.sha }} | cut -c1-7)"
            
            # Créer le réseau Docker s'il n'existe pas
            docker network create glpi-dev-network 2>/dev/null || true
            
            # Démarrer MySQL pour dev
            if ! docker ps -a | grep -q mysql-dev; then
              docker run -d \
                --name mysql-dev \
                --network glpi-dev-network \
                --restart unless-stopped \
                -e MYSQL_ROOT_PASSWORD=glpi_password \
                -e MYSQL_DATABASE=glpi \
                -e MYSQL_USER=glpi \
                -e MYSQL_PASSWORD=glpi_password \
                -v mysql-dev-data:/var/lib/mysql \
                mysql:5.7
              
              echo "Attente de MySQL..."
              sleep 30
            fi
            
            # Déployer GLPI
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${IMAGE}:${TAG}
            docker stop glpi-dev 2>/dev/null || true
            docker rm glpi-dev 2>/dev/null || true
            
            docker run -d \
              --name glpi-dev \
              --network glpi-dev-network \
              --restart unless-stopped \
              -p 127.0.0.1:8081:80 \
              -v glpi-dev-data:/var/www/html/files \
              -v glpi-dev-config:/var/www/html/config \
              -e DB_HOST="mysql-dev" \
              -e DB_NAME="glpi" \
              -e DB_USER="glpi" \
              -e DB_PASSWORD="glpi_password" \
              ${IMAGE}:${TAG}
            
            sleep 10
            if ! docker ps | grep -q glpi-dev; then
              echo "Dev deployment failed"
              docker logs glpi-dev
              exit 1
            fi
            echo "Dev deployment successful"

  # Job 8: Deploy Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
            TAG="ci-cdmysql-$(echo ${{ github.sha }} | cut -c1-7)"
            
            # Créer le réseau Docker s'il n'existe pas
            docker network create glpi-staging-network 2>/dev/null || true
            
            # Démarrer MySQL pour staging
            if ! docker ps -a | grep -q mysql-staging; then
              docker run -d \
                --name mysql-staging \
                --network glpi-staging-network \
                --restart unless-stopped \
                -e MYSQL_ROOT_PASSWORD=glpi_password \
                -e MYSQL_DATABASE=glpi \
                -e MYSQL_USER=glpi \
                -e MYSQL_PASSWORD=glpi_password \
                -v mysql-staging-data:/var/lib/mysql \
                mysql:5.7
              
              echo "Attente de MySQL..."
              sleep 30
            fi
            
            # Déployer GLPI
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${IMAGE}:${TAG}
            docker stop glpi-staging 2>/dev/null || true
            docker rm glpi-staging 2>/dev/null || true
            
            docker run -d \
              --name glpi-staging \
              --network glpi-staging-network \
              --restart unless-stopped \
              -p 127.0.0.1:8082:80 \
              -v glpi-staging-data:/var/www/html/files \
              -v glpi-staging-config:/var/www/html/config \
              -e DB_HOST="mysql-staging" \
              -e DB_NAME="glpi" \
              -e DB_USER="glpi" \
              -e DB_PASSWORD="glpi_password" \
              ${IMAGE}:${TAG}
            
            sleep 10
            if ! docker ps | grep -q glpi-staging; then
              echo "Staging deployment failed"
              docker logs glpi-staging
              exit 1
            fi
            echo "Staging deployment successful"

  # Job 9: Deploy Production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            IMAGE="ghcr.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}"
            TAG="ci-cdmysql-$(echo ${{ github.sha }} | cut -c1-7)"
            
            # Créer le réseau Docker s'il n'existe pas
            docker network create glpi-prod-network 2>/dev/null || true
            
            # Démarrer MySQL pour production
            if ! docker ps -a | grep -q mysql-prod; then
              docker run -d \
                --name mysql-prod \
                --network glpi-prod-network \
                --restart unless-stopped \
                -e MYSQL_ROOT_PASSWORD=glpi_password \
                -e MYSQL_DATABASE=glpi \
                -e MYSQL_USER=glpi \
                -e MYSQL_PASSWORD=glpi_password \
                -v mysql-prod-data:/var/lib/mysql \
                mysql:5.7
              
              echo "Attente de MySQL..."
              sleep 30
            fi
            
            # Déployer GLPI
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${IMAGE}:${TAG}
            docker stop glpi-prod 2>/dev/null || true
            docker rm glpi-prod 2>/dev/null || true
            
            docker run -d \
              --name glpi-prod \
              --network glpi-prod-network \
              --restart unless-stopped \
              -p 127.0.0.1:8080:80 \
              -v glpi-prod-data:/var/www/html/files \
              -v glpi-prod-config:/var/www/html/config \
              -e DB_HOST="mysql-prod" \
              -e DB_NAME="glpi" \
              -e DB_USER="glpi" \
              -e DB_PASSWORD="glpi_password" \
              ${IMAGE}:${TAG}
            
            sleep 15
            if ! docker ps | grep -q glpi-prod; then
              echo "Production deployment failed"
              docker logs glpi-prod
              exit 1
            fi
            echo "Production deployment successful"
